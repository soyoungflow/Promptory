name: Django CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: promptory_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d promptory_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: ci-secret-key-for-promptory-tests-32bytes-minimum
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: promptory_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Django config
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test -v 1

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t promptory-web:ci .

  compose-smoke:
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Compose stack
        run: docker compose up -d --build

      - name: Wait for containers to become healthy
        run: |
          for i in {1..60}; do
            DB_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' promptory-db-1 2>/dev/null || true)
            REDIS_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' promptory-redis-1 2>/dev/null || true)
            AI_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' promptory-ai_server-1 2>/dev/null || true)
            WEB_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' promptory-web-1 2>/dev/null || true)
            NGINX_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' promptory-nginx-1 2>/dev/null || true)
            echo "db=$DB_STATUS redis=$REDIS_STATUS ai=$AI_STATUS web=$WEB_STATUS nginx=$NGINX_STATUS"
            if [ "$DB_STATUS" = "healthy" ] && [ "$REDIS_STATUS" = "healthy" ] && [ "$AI_STATUS" = "healthy" ] && [ "$WEB_STATUS" = "healthy" ] && [ "$NGINX_STATUS" = "healthy" ]; then
              echo "Compose services are ready."
              exit 0
            fi
            sleep 3
          done
          echo "Compose services failed to become ready in time."
          docker compose ps
          docker compose logs
          exit 1

      - name: Smoke check HTTP endpoint (nginx proxy)
        run: |
          curl -fsS --retry 5 --retry-connrefused --retry-all-errors --retry-delay 2 http://127.0.0.1/
          curl -fsS --retry 5 --retry-connrefused --retry-all-errors --retry-delay 2 http://127.0.0.1/ai/health
          curl -fsS --retry 5 --retry-connrefused --retry-all-errors --retry-delay 2 http://127.0.0.1/static/css/main.css

      - name: Show compose status
        if: always()
        run: docker compose ps

      - name: Tear down compose
        if: always()
        run: docker compose down -v
