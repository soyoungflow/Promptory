name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy to EC2 (Docker Compose)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          command_timeout: 25m
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            APP_DIR="${APP_DIR#"${APP_DIR%%[![:space:]]*}"}"
            APP_DIR="${APP_DIR%"${APP_DIR##*[![:space:]]}"}"

            if [ -z "$APP_DIR" ]; then
              echo "EC2_APP_DIR secret is empty"
              exit 1
            fi

            cd "$APP_DIR"
            TRIGGER_SHA="${{ github.sha }}"

            echo "=== [1/7] SSH connected ==="
            whoami
            pwd

            echo "=== [2/7] Version check (before sync) ==="
            git fetch origin main
            LOCAL_SHA="$(git rev-parse HEAD 2>/dev/null || echo 'none')"
            REMOTE_SHA="$(git rev-parse origin/main)"
            echo "Local  HEAD:  $LOCAL_SHA"
            echo "Remote main:  $REMOTE_SHA"
            echo "GitHub push:  $TRIGGER_SHA"

            echo "=== [3/7] Sync latest main ==="
            git checkout main
            git reset --hard origin/main
            DEPLOYED_SHA="$(git rev-parse HEAD)"
            REMOTE_SHA="$(git rev-parse origin/main)"
            git log -1 --oneline

            echo "Deployed: $DEPLOYED_SHA"
            echo "Remote:   $REMOTE_SHA"
            echo "Trigger:  $TRIGGER_SHA"

            # SHA 체크는 "검증/경고용"만 사용 (배포 흐름을 막지 않음)
            if [ "$DEPLOYED_SHA" = "$REMOTE_SHA" ]; then
              echo "OK: deployed SHA matches origin/main"
            else
              echo "WARN: deployed SHA differs from origin/main (continuing deploy)"
            fi

            if [ "$DEPLOYED_SHA" = "$TRIGGER_SHA" ]; then
              echo "OK: deployed SHA matches GitHub push SHA"
            else
              echo "WARN: deployed SHA differs from trigger SHA (continuing deploy)"
            fi

            echo "=== [4/7] Ensure .env exists ==="
            if [ ! -f .env ]; then
              echo ".env not found in $APP_DIR"
              exit 1
            fi

            echo "=== [5/7] Rebuild and restart Docker Compose ==="
            docker compose pull || true
            docker compose up -d --build

            # web 컨테이너는 startup 시 migrate → daphne 순으로 기동함 (docker-compose.yml command 참고).
            # compose up 직후에는 (health: starting) 상태일 수 있으므로,
            # 여기서는 migrate만 짧게 재시도해서 실패 지점을 단순화한다.
            echo "=== [6/7] Run migrate (retry) ==="
            MIGRATE_OK=0
            for i in {1..10}; do
              echo "migrate attempt $i/10..."
              if docker compose exec -T web python manage.py migrate --noinput; then
                MIGRATE_OK=1
                break
              fi
              sleep 3
            done

            if [ "$MIGRATE_OK" -ne 1 ]; then
              echo "ERROR: migrate failed after retries"
              docker compose ps
              docker compose logs web --tail 80 || true
              exit 1
            fi

            echo "=== [7/7] Post-deploy smoke check ==="
            docker compose ps
            curl -fsS --retry 8 --retry-connrefused --retry-all-errors --retry-delay 3 \
              http://127.0.0.1/ >/dev/null
            curl -fsS --retry 5 --retry-connrefused --retry-all-errors --retry-delay 3 \
              http://127.0.0.1/ai/health >/dev/null
            curl -fsS --retry 5 --retry-connrefused --retry-all-errors --retry-delay 3 \
              http://127.0.0.1/static/css/main.css >/dev/null
            curl -fsS --retry 5 --retry-connrefused --retry-all-errors --retry-delay 3 \
              http://127.0.0.1/grafana/api/health | grep -qE '"database"[[:space:]]*:[[:space:]]*"ok"'
            curl -fsS --retry 5 --retry-connrefused --retry-all-errors --retry-delay 3 \
              http://127.0.0.1/prometheus/prometheus/-/healthy | grep -q 'Healthy'

            docker image prune -f || true

            echo "Deploy complete"
            echo "Deployed SHA: $DEPLOYED_SHA"
            echo "$(git log -1 --format='%h %ci %s')"
