name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy to EC2 (Docker Compose)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          command_timeout: 25m
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            APP_DIR="${APP_DIR#"${APP_DIR%%[![:space:]]*}"}"
            APP_DIR="${APP_DIR%"${APP_DIR##*[![:space:]]}"}"

            if [ -z "$APP_DIR" ]; then
              echo "EC2_APP_DIR secret is empty"
              exit 1
            fi

            cd "$APP_DIR"
            TRIGGER_SHA="${{ github.sha }}"

            echo "=== [1/9] SSH connected ==="
            whoami
            pwd

            echo "=== [2/9] Version check (before sync) ==="
            git fetch origin main
            LOCAL_SHA="$(git rev-parse HEAD 2>/dev/null || echo 'none')"
            REMOTE_SHA="$(git rev-parse origin/main)"
            echo "Local  HEAD:  $LOCAL_SHA"
            echo "Remote main:  $REMOTE_SHA"
            echo "GitHub push:  $TRIGGER_SHA"

            echo "=== [3/9] Sync latest main ==="
            git checkout main
            git reset --hard origin/main
            DEPLOYED_SHA="$(git rev-parse HEAD)"
            REMOTE_SHA="$(git rev-parse origin/main)"
            git log -1 --oneline

            echo "Deployed: $DEPLOYED_SHA"
            echo "Remote:   $REMOTE_SHA"
            echo "Trigger:  $TRIGGER_SHA"

            # SHA 체크는 "검증/경고용"만 사용 (배포 흐름을 막지 않음)
            if [ "$DEPLOYED_SHA" = "$REMOTE_SHA" ]; then
              echo "OK: deployed SHA matches origin/main"
            else
              echo "WARN: deployed SHA differs from origin/main (continuing deploy)"
            fi

            if [ "$DEPLOYED_SHA" = "$TRIGGER_SHA" ]; then
              echo "OK: deployed SHA matches GitHub push SHA"
            else
              echo "WARN: deployed SHA differs from trigger SHA (continuing deploy)"
            fi

            echo "=== [4/9] Ensure .env exists ==="
            if [ ! -f .env ]; then
              echo ".env not found in $APP_DIR"
              exit 1
            fi

            echo "=== [5/9] Disk check and Docker cleanup ==="
            df -h / /var/lib/docker 2>/dev/null || df -h /

            # HF 이미지 빌드 캐시·미사용 레이어가 누적되면 no space left on device 발생
            docker compose down --remove-orphans 2>/dev/null || true
            docker builder prune -af 2>/dev/null || true
            docker image prune -af 2>/dev/null || true
            docker container prune -f 2>/dev/null || true
            docker system prune -af --volumes=false 2>/dev/null || true

            FREE_MB="$(df -m / | awk 'NR==2 {print $4}')"
            echo "Free disk after cleanup: ${FREE_MB}MB"
            df -h /

            MIN_FREE_MB=1800
            if [ "${FREE_MB}" -lt "${MIN_FREE_MB}" ]; then
              echo "ERROR: EC2 disk still low (${FREE_MB}MB < ${MIN_FREE_MB}MB)."
              echo "Resize EBS volume or SSH in and run: docker system prune -af && docker builder prune -af"
              exit 1
            fi

            echo "=== [6/9] Rebuild and restart Docker Compose ==="
            docker compose pull || true
            docker compose up -d --build
            # EC2 메모리 압박 시 grafana가 누락되는 경우가 있어 모니터링 스택을 명시적으로 기동
            docker compose up -d grafana prometheus

            echo "=== [7/9] Wait for containers to become healthy ==="
            WAIT_OK=0
            for i in {1..60}; do
              DB_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' promptory-db-1 2>/dev/null || true)
              REDIS_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' promptory-redis-1 2>/dev/null || true)
              AI_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' promptory-ai_server-1 2>/dev/null || true)
              WEB_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' promptory-web-1 2>/dev/null || true)
              NGINX_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' promptory-nginx-1 2>/dev/null || true)
              GRAFANA_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' promptory-grafana-1 2>/dev/null || true)
              PROM_STATUS=$(docker inspect --format='{{.State.Status}}' promptory-prometheus-1 2>/dev/null || echo "missing")
              echo "attempt $i/60: db=$DB_STATUS redis=$REDIS_STATUS ai=$AI_STATUS web=$WEB_STATUS nginx=$NGINX_STATUS grafana=$GRAFANA_STATUS prometheus=$PROM_STATUS"
              if [ "$GRAFANA_STATUS" != "healthy" ] && [ "$i" = "20" ]; then
                echo "grafana still not healthy — reset volume and recreate (Grafana 13 UID mismatch recovery)"
                docker compose stop grafana || true
                docker volume rm -f promptory_grafana_data 2>/dev/null || true
                docker compose up -d --force-recreate grafana || true
              fi
              if [ "$DB_STATUS" = "healthy" ] && [ "$REDIS_STATUS" = "healthy" ] && [ "$AI_STATUS" = "healthy" ] && [ "$WEB_STATUS" = "healthy" ] && [ "$NGINX_STATUS" = "healthy" ] && [ "$GRAFANA_STATUS" = "healthy" ] && [ "$PROM_STATUS" = "running" ]; then
                WAIT_OK=1
                echo "Compose services are ready."
                break
              fi
              sleep 3
            done

            if [ "$WAIT_OK" -ne 1 ]; then
              echo "ERROR: Compose services failed to become healthy in time."
              docker compose ps -a
              docker compose logs nginx --tail 80 || true
              docker compose logs web --tail 80 || true
              docker compose logs grafana --tail 80 || true
              exit 1
            fi

            # web 컨테이너는 startup 시 migrate → daphne 순으로 기동함 (docker-compose.yml command 참고).
            echo "=== [8/9] Run migrate (retry) ==="
            MIGRATE_OK=0
            for i in {1..10}; do
              echo "migrate attempt $i/10..."
              if docker compose exec -T web python manage.py migrate --noinput; then
                MIGRATE_OK=1
                break
              fi
              sleep 3
            done

            if [ "$MIGRATE_OK" -ne 1 ]; then
              echo "ERROR: migrate failed after retries"
              docker compose ps
              docker compose logs web --tail 80 || true
              exit 1
            fi

            echo "=== [8a/9] Seed demo data (idempotent) ==="
            docker compose exec -T web python manage.py seed_mockup || echo "WARN: seed_mockup failed (continuing)"

            echo "=== [8b/9] Collect static files (admin CSS 등) ==="
            docker compose exec -T web python manage.py collectstatic --noinput
            docker compose up -d --force-recreate nginx

            echo "=== [9/9] Post-deploy smoke check ==="
            docker compose ps
            curl -fsS --retry 8 --retry-connrefused --retry-all-errors --retry-delay 3 \
              http://127.0.0.1/ >/dev/null
            curl -fsS --retry 5 --retry-connrefused --retry-all-errors --retry-delay 3 \
              http://127.0.0.1/ai/health >/dev/null
            curl -fsS --retry 5 --retry-connrefused --retry-all-errors --retry-delay 3 \
              http://127.0.0.1/static/css/main.css >/dev/null
            curl -fsS --retry 5 --retry-connrefused --retry-all-errors --retry-delay 3 \
              http://127.0.0.1/static/admin/css/base.css >/dev/null
            curl -fsS --retry 5 --retry-connrefused --retry-all-errors --retry-delay 3 \
              http://127.0.0.1/grafana/api/health | grep -qE '"database"[[:space:]]*:[[:space:]]*"ok"'
            curl -fsS --retry 5 --retry-connrefused --retry-all-errors --retry-delay 3 \
              http://127.0.0.1/prometheus/prometheus/-/healthy | grep -q 'Healthy'

            docker image prune -f || true

            echo "Deploy complete"
            echo "Deployed SHA: $DEPLOYED_SHA"
            echo "$(git log -1 --format='%h %ci %s')"
