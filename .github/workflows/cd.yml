name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH and app directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            set -e

            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            APP_DIR="$(echo "$APP_DIR" | xargs)"

            echo "SSH connected"
            echo "Current user:"
            whoami

            echo "Current directory:"
            pwd

            echo "App directory:"
            echo "$APP_DIR"

            echo "Move to app directory"
            cd "$APP_DIR"

            echo "Now in:"
            pwd

            echo "Files:"
            ls -al
