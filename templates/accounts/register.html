{% extends 'base.html' %}
{% load static %}
{% block title %}회원가입 — Promptory{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-brand">
    <a href="{% url 'home-page' %}" class="auth-logo">Promptory</a>
    <p>새 계정 만들기</p>
  </div>
  <div class="auth-card">
    <h1 class="auth-title">회원가입</h1>
    <p class="auth-sub">이미 계정이 있으신가요? <a href="{% url 'login-page' %}">로그인</a></p>
    <div id="register-error" class="alert alert-error" style="display:none;"></div>
    <form id="register-form" class="auth-form" novalidate>
      <div class="form-group">
        <label for="username">사용자명</label>
        <input type="text" id="username" name="username" placeholder="사용자명" required>
        <span class="field-error" id="username-error"></span>
      </div>
      <div class="form-group">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" placeholder="email@example.com" required>
        <span class="field-error" id="email-error"></span>
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" placeholder="8자 이상" required>
        <span class="field-error" id="password-error"></span>
      </div>
      <div class="form-group">
        <label for="password2">비밀번호 확인</label>
        <input type="password" id="password2" name="password2" placeholder="비밀번호 재입력" required>
        <span class="field-error" id="password2-error"></span>
      </div>
      <button type="submit" class="btn btn-primary btn-full">가입하기</button>
    </form>
  </div>
</div>
{% endblock %}
{% block extra_js %}<script src="{% static 'js/register.js' %}"></script>{% endblock %}
