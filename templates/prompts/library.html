{% extends "base.html" %}
{% load static %}
{% block title %}보관함 — Promptory{% endblock %}
{% block content %}
<div class="library-page list-page">
  <div class="explore-header">
    <div>
      <h1>보관함</h1>
      <p>북마크·좋아요·내 프롬프트·댓글을 한곳에서 확인하고 관리합니다.</p>
    </div>
  </div>

  <div id="library-guest" class="empty-state" style="display:none;">
    <p>로그인 후 보관함을 이용할 수 있습니다.</p>
    <p style="margin-top:12px;">
      <a href="{% url 'login-page' %}" class="btn btn-primary">로그인</a>
      <a href="{% url 'register-page' %}" class="btn btn-secondary">회원가입</a>
    </p>
  </div>

  <div id="library-main" style="display:none;">
    <div class="view-toggle library-tabs" role="tablist" aria-label="보관함 구분">
      <button type="button" class="active" data-tab="bookmarks" role="tab" aria-selected="true">북마크</button>
      <button type="button" data-tab="likes" role="tab" aria-selected="false">좋아요한 프롬프트</button>
      <button type="button" data-tab="mine" role="tab" aria-selected="false">내가 등록한 프롬프트</button>
      <button type="button" data-tab="transforms" role="tab" aria-selected="false">내 변환</button>
      <button type="button" data-tab="comments" role="tab" aria-selected="false">내가 쓴 댓글</button>
    </div>

    <div id="panel-bookmarks" class="library-panel" role="tabpanel">
      <p id="bookmark-count" class="result-count" style="margin: 14px 0 10px;"></p>
      <div id="bookmark-grid" class="prompt-grid">
        <div class="loading-spinner">불러오는 중...</div>
      </div>
    </div>

    <div id="panel-likes" class="library-panel" role="tabpanel" hidden>
      <p id="like-count" class="result-count" style="margin: 14px 0 10px;"></p>
      <div id="like-grid" class="prompt-grid">
        <div class="loading-spinner">불러오는 중...</div>
      </div>
    </div>

    <div id="panel-mine" class="library-panel" role="tabpanel" hidden>
      <p id="mine-count" class="result-count" style="margin: 14px 0 10px;"></p>
      <div id="mine-grid" class="prompt-grid">
        <div class="loading-spinner">불러오는 중...</div>
      </div>
    </div>

    <div id="panel-transforms" class="library-panel" role="tabpanel" hidden>
      <p id="transforms-count" class="result-count" style="margin: 14px 0 10px;"></p>
      <div id="transforms-list" class="library-transforms">
        <div class="loading-spinner">불러오는 중...</div>
      </div>
    </div>

    <div id="panel-comments" class="library-panel" role="tabpanel" hidden>
      <p id="comments-count" class="result-count" style="margin: 14px 0 10px;"></p>
      <div id="comments-list" class="library-comments">
        <div class="loading-spinner">불러오는 중...</div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/library.js' %}"></script>
{% endblock %}
