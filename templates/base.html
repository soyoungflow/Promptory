<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Promptory{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <div class="nav-left">
      <a href="{% url 'home-page' %}" class="nav-logo brand">
        <span class="brand-name">Promptory</span>
        <span class="brand-tagline">AI 업무 자동화 설계서 마켓</span>
      </a>
      <div class="nav-links">
        <a href="{% url 'home-page' %}" class="nav-link {% if request.resolver_match.url_name == 'home-page' %}active{% endif %}">홈</a>
        <a href="{% url 'prompt-list-page' %}" class="nav-link {% if request.resolver_match.url_name == 'prompt-list-page' %}active{% endif %}">탐색</a>
        <a href="{% url 'prompt-create-page' %}" class="nav-link auth-only {% if request.resolver_match.url_name == 'prompt-create-page' or request.resolver_match.url_name == 'prompt-edit-page' %}active{% endif %}" style="display:none;">+ 프롬프트 등록</a>
        <a href="{% url 'blueprint-design-page' %}" class="nav-link nav-link-cta {% if request.resolver_match.url_name == 'blueprint-design-page' or request.resolver_match.url_name == 'blueprint-design-detail-page' %}active{% endif %}">설계서 만들기</a>
      </div>
    </div>
    <div class="nav-actions">
      <a href="{% url 'library-page' %}" class="nav-link auth-only {% if request.resolver_match.url_name == 'library-page' %}active{% endif %}" style="display:none;">보관함</a>
      <span id="nav-auth-area">
        <!-- JS가 로그인 상태에 따라 동적으로 렌더링 -->
      </span>
    </div>
  </div>
</nav>

<main class="{% block main_class %}main-container{% endblock %}">
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <p>Promptory © 2026 — AI 업무 자동화 설계서 마켓</p>
</footer>

<!-- 전역 상태 (Django → JS 전달) -->
<script>
  window.PROMPTORY = {
    isAuthenticated: false,
    userId: null,
    userEmail: '',
    apiBase: '/api',
    csrfToken: '{{ csrf_token }}',
  };
</script>
<script src="{% static 'js/auth.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
